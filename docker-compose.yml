version: '3.8'

services:
  # PostgreSQL Database (Alternative to Supabase for local dev)
  postgres:
    image: postgres:16-alpine
    container_name: hotnotclub_postgres
    environment:
      POSTGRES_USER: hotnotclub
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: hotnotclub_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotnotclub"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotnotclub_network

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: hotnotclub_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hotnotclub.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - hotnotclub_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  hotnotclub_network:
    driver: bridge
